<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opções de Pagamento | Pagamento Seguro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <style>
        :root {
            --primary: #0055ff;
            --primary-dark: #0033cc;
            --primary-light: #e8f0ff;
            --accent: #00bfff;
            --success: #28a745;
            --warning: #ff6b35;
            --danger: #ff3b30;
            --text-dark: #1a1a1a;
            --text-gray: #555;
            --text-light: #888;
            --bg-light: #f5f7fa;
            --bg-white: #ffffff;
            --border-color: #e0e4e8;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.06);
            --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.12);
            --pix-color: var(--primary);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: var(--bg-light); color: var(--text-dark); line-height: 1.6; }
        body { min-height: 100vh; display: flex; justify-content: center; align-items: flex-start; padding: 0; }

        .container { width: 100%; max-width: 480px; background-color: var(--bg-white); box-shadow: var(--shadow-md); display: flex; flex-direction: column; }

        .header { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); color: var(--bg-white); padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
        .header-left { display: flex; align-items: center; gap: 12px; flex: 1; }
        .back-btn { background: rgba(255, 255, 255, 0.2); border: none; color: var(--bg-white); font-size: 1.1rem; cursor: pointer; padding: 8px 10px; border-radius: 6px; }
        .brand-logo { font-size: 1.3rem; font-weight: 800; letter-spacing: -1px; }
        .brand-tagline { font-size: 0.7rem; opacity: 0.9; font-weight: 500; text-transform: uppercase; }

        .trust-banner { background: linear-gradient(90deg, rgba(40, 167, 69, 0.1) 0%, rgba(0, 191, 255, 0.1) 100%); border-bottom: 1px solid rgba(40, 167, 69, 0.2); padding: 10px 20px; display: flex; justify-content: space-around; font-size: 0.75rem; color: var(--text-gray); font-weight: 600; }
        .trust-item { display: flex; align-items: center; gap: 6px; }
        .trust-item i { color: var(--success); }

        .review-block { padding: 20px; background-color: var(--bg-white); }
        .review-header-bar { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid var(--border-color); }
        .review-header-title { font-size: 1.2rem; font-weight: 800; display: flex; align-items: center; gap: 10px; }
        .review-header-title i { color: var(--primary); }

        .payment-option-card { border: 2px solid var(--border-color); border-radius: 20px; padding: 24px; margin-bottom: 20px; cursor: pointer; position: relative; transition: all 0.3s; }
        .payment-option-card.selected { border: 3px solid var(--primary); background: rgba(0, 85, 255, 0.02); }
        .payment-option-card.selected::after { content: '✓'; position: absolute; top: 16px; right: 16px; width: 28px; height: 28px; background: var(--primary); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 900; }

        .payment-option-icon { font-size: 1.8rem; color: var(--primary); margin-bottom: 4px; }
        .payment-option-title { font-size: 1.1rem; font-weight: 800; display: flex; align-items: center; gap: 10px; }
        .promo-badge { background: rgba(40, 167, 69, 0.08); color: #1e7e34; border: 1px solid rgba(40, 167, 69, 0.2); padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: 600; }
        .payment-option-price { font-size: 1.5rem; font-weight: 900; color: var(--primary); }
        .payment-option-desc { font-size: 0.85rem; color: var(--text-gray); }

        .pix-form-container { margin-top: 15px; padding-top: 15px; border-top: 1px solid var(--border-color); display: none; flex-direction: column; gap: 12px; }
        .payment-option-card.selected .pix-form-container { display: flex; }

        .pix-input-group { display: flex; flex-direction: column; gap: 5px; }
        .pix-input-group label { font-size: 0.75rem; font-weight: 700; color: var(--primary); text-transform: uppercase; }
        .pix-input-group input { padding: 12px 14px; border: 1.5px solid var(--border-color); border-radius: 10px; font-size: 0.95rem; outline: none; }
        .pix-input-group input:focus { border-color: var(--primary); }

        .payment-action-btn { background: var(--pix-color); color: white; border: none; padding: 16px; border-radius: 12px; font-weight: 800; font-size: 1rem; cursor: pointer; width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .payment-action-btn:disabled { opacity: 0.7; }

        /* Modal Iframe */
        .pix-modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; z-index: 2000; align-items: center; justify-content: center; padding: 10px; }
        .pix-modal-overlay.active { display: flex; }
        .pix-modal-content { background: white; width: 100%; max-width: 450px; height: 90vh; border-radius: 20px; overflow: hidden; position: relative; display: flex; flex-direction: column; }
        .pix-modal-header { padding: 15px 20px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        .pix-modal-close { background: #f0f2f5; border: none; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; }
        .pix-iframe { flex: 1; border: none; width: 100%; height: 100%; }

        /* Delivery Modal */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 20px; backdrop-filter: blur(4px); }
        .modal-overlay.active { display: flex; }
        .modal-content { background: white; width: 100%; max-width: 400px; border-radius: 24px; padding: 30px; position: relative; }
        .modal-title { font-size: 1.4rem; font-weight: 800; text-align: center; margin-bottom: 10px; }
        .modal-text { text-align: center; color: var(--text-gray); font-size: 0.95rem; margin-bottom: 25px; }
        .btn-modal { padding: 16px; border-radius: 14px; font-weight: 800; font-size: 1rem; cursor: pointer; border: none; width: 100%; margin-bottom: 10px; }
        .btn-modal-continue { background: var(--primary); color: white; }
        .btn-modal-pix { background: var(--pix-color); color: white; }

        .spinner { width: 20px; height: 20px; border: 3px solid rgba(255,255,255,0.3); border-radius: 50%; border-top-color: white; animation: spin 0.8s linear infinite; margin: 0 auto; }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="header-left">
                <button class="back-btn"><i class="fas fa-arrow-left"></i></button>
                <div class="brand-section">
                    <div class="brand-logo">PAG-ONLINE</div>
                    <div class="brand-tagline">Pagamento Seguro</div>
                </div>
            </div>
            <div class="header-right">
                <button class="cart-btn"><i class="fas fa-shopping-cart"></i><span class="cart-badge">1</span></button>
            </div>
        </header>

        <div class="trust-banner">
            <div class="trust-item"><i class="fas fa-lock"></i> <span>100% Seguro</span></div>
            <div class="trust-item"><i class="fas fa-check-circle"></i> <span>Garantido</span></div>
        </div>

        <div id="cart-content-wrapper"></div>
    </div>

    <!-- Modal do Pix (Iframe Pagar.me) -->
    <div class="pix-modal-overlay" id="pix-modal">
        <div class="pix-modal-content">
            <div class="pix-modal-header">
                <span style="font-weight: 800; color: var(--primary);"><i class="fas fa-shield-alt"></i> Pagamento Seguro</span>
                <button class="pix-modal-close" id="close-pix-modal"><i class="fas fa-times"></i></button>
            </div>
            <iframe src="" class="pix-iframe" id="pix-iframe"></iframe>
        </div>
    </div>

    <!-- Modal de Entrega -->
    <div class="modal-overlay" id="delivery-modal">
        <div class="modal-content">
            <div id="modal-step-1">
                <h3 class="modal-title">Você tem certeza?</h3>
                <p class="modal-text" id="delivery-warning-text"></p>
                <button class="btn-modal btn-modal-pix" id="modal-back-to-pix">Voltar para o Pix (Desconto)</button>
                <button class="btn-modal btn-modal-continue" id="modal-continue-delivery">Continuar sem desconto</button>
            </div>
            <div id="modal-step-2" style="display:none;">
                <h3 class="modal-title">Dados para Entrega</h3>
                <form id="delivery-contact-form" style="display:flex; flex-direction:column; gap:10px;">
                    <input type="text" id="delivery-name" placeholder="Nome Completo" required style="padding:12px; border-radius:10px; border:1px solid #ddd;">
                    <input type="email" id="delivery-email" placeholder="E-mail" required style="padding:12px; border-radius:10px; border:1px solid #ddd;">
                    <input type="tel" id="delivery-cpf" placeholder="CPF" required style="padding:12px; border-radius:10px; border:1px solid #ddd;">
                    <input type="tel" id="delivery-phone" placeholder="Telefone" required style="padding:12px; border-radius:10px; border:1px solid #ddd;">
                    <button type="submit" class="btn-modal btn-modal-continue">Enviar Pedido</button>
                </form>
            </div>
            <div id="modal-step-3" style="display:none;">
                <h3 class="modal-title">Pedido Recebido!</h3>
                <p class="modal-text">Entraremos em contato em breve.</p>
                <button class="btn-modal btn-modal-continue" onclick="location.reload()">Fechar</button>
            </div>
        </div>
    </div>

    <script>
        const subtotalValue = new URLSearchParams(window.location.search).get('subtotal') || 89.47;

        function renderOptions() {
            const base = parseFloat(subtotalValue);
            const delivery = base * 1.46;
            
            document.getElementById('cart-content-wrapper').innerHTML = `
                <div class="review-block">
                    <div class="review-header-bar"><div class="review-header-title"><i class="fas fa-credit-card"></i> Opções de Pagamento</div></div>
                    <div class="payment-option-card selected" id="card-pix">
                        <div class="payment-option-icon"><i class="fas fa-bolt"></i></div>
                        <div class="payment-option-title">Pagar Agora - Pix <span class="promo-badge">Promoção</span></div>
                        <div class="payment-option-price">R$ ${base.toFixed(2).replace('.',',')}</div>
                        <div class="payment-option-desc">Liberação imediata e melhor preço.</div>
                        <div class="pix-form-container" style="display:flex;">
                            <div class="pix-input-group"><label>Nome Completo</label><input type="text" id="pix-name" required></div>
                            <div class="pix-input-group"><label>CPF</label><input type="tel" id="pix-cpf" maxlength="14" required></div>
                            <div class="pix-input-group"><label>Telefone</label><input type="tel" id="pix-phone" required></div>
                            <button class="payment-action-btn" id="btn-generate">GERAR QR CODE PIX <i class="fas fa-arrow-right"></i></button>
                        </div>
                    </div>
                    <div class="payment-option-card" id="card-delivery">
                        <div class="payment-option-icon"><i class="fas fa-truck"></i></div>
                        <div class="payment-option-title">Pagar na Entrega</div>
                        <div class="payment-option-price">R$ ${delivery.toFixed(2).replace('.',',')}</div>
                        <div class="payment-option-desc">Sem o desconto de 46% do Pix.</div>
                        <button class="payment-action-btn" id="btn-delivery" style="background:#333; margin-top:15px; display:none;">CONTINUAR PEDIDO</button>
                    </div>
                </div>
            `;

            setupEvents();
        }

        function setupEvents() {
            const cPix = document.getElementById('card-pix');
            const cDel = document.getElementById('card-delivery');
            const bGen = document.getElementById('btn-generate');
            const bDel = document.getElementById('btn-delivery');

            cPix.onclick = () => { cPix.classList.add('selected'); cDel.classList.remove('selected'); bDel.style.display='none'; };
            cDel.onclick = () => { cDel.classList.add('selected'); cPix.classList.remove('selected'); bDel.style.display='block'; };

            bGen.onclick = async () => {
                const name = document.getElementById('pix-name').value;
                const cpf = document.getElementById('pix-cpf').value;
                const phone = document.getElementById('pix-phone').value;
                if(!name || !cpf || !phone) return alert('Preencha os dados');

                bGen.disabled = true; bGen.innerHTML = '<div class="spinner"></div>';
                try {
                    const res = await fetch('/api/create-pix-order', {
                        method: 'POST',
                        headers: {'Content-Type':'application/json'},
                        body: JSON.stringify({name, cpf, phone, amount: subtotalValue})
                    });
                    const data = await res.json();
                    if(data.success) {
                        document.getElementById('pix-iframe').src = data.checkout_url;
                        document.getElementById('pix-modal').classList.add('active');
                    }
                } catch(e) { alert('Erro ao gerar Pix'); }
                bGen.disabled = false; bGen.innerHTML = 'GERAR QR CODE PIX <i class="fas fa-arrow-right"></i>';
            };

            bDel.onclick = () => {
                document.getElementById('delivery-warning-text').innerText = 'Você perderá o desconto exclusivo do Pix. Deseja continuar?';
                document.getElementById('delivery-modal').classList.add('active');
            };
        }

        document.getElementById('close-pix-modal').onclick = () => document.getElementById('pix-modal').classList.remove('active');
        document.getElementById('modal-back-to-pix').onclick = () => document.getElementById('delivery-modal').classList.remove('active');
        document.getElementById('modal-continue-delivery').onclick = () => {
            document.getElementById('modal-step-1').style.display = 'none';
            document.getElementById('modal-step-2').style.display = 'block';
        };

        renderOptions();
    </script>
</body>
</html>
